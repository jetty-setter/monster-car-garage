services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: garage
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage_local_only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage -d garage"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: monster-car-garage:postgres-local
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: postgres-local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/garage
      SPRING_DATASOURCE_USERNAME: garage
      SPRING_DATASOURCE_PASSWORD: garage_local_only
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: monster-garage-postgres-data