name: Garage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get the project code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: garage/pom.xml

      - name: Test and build the garage
        working-directory: garage
        run: sh ./mvnw --batch-mode --no-transfer-progress verify
  check-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Get the project code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infrastructure dependencies
        run: npm ci

      - name: Compile infrastructure code
        run: npm run build

      - name: Test infrastructure safeguards
        run: npm run test -- --runInBand

      - name: Generate the AWS blueprint
        run: npm run cdk -- synth --no-lookups

      - name: Build the container image
        working-directory: .
        run: docker build -t monster-car-garage:${{ github.sha }} .

